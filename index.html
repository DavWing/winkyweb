<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貸款月曆 - Loan Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans TC', sans-serif;
    color: #33322F;
    background: #FAFAF7;
  }

  #app {
    min-height: 100vh;
    width: 100%;
    background: #FAFAF7;
    padding: 56px 64px 80px;
    position: relative;
  }

  .background-accent {
    position: absolute;
    top: 44px;
    right: 64px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 1.5px solid #DEDACC;
    opacity: 0.7;
    pointer-events: none;
  }

  .background-accent-small {
    position: absolute;
    top: 74px;
    right: 94px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 1px solid #DEDACC;
    opacity: 0.5;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 24px;
    position: relative;
  }

  .header-text h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 42px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .header-text .subtitle {
    font-size: 14px;
    letter-spacing: 0.08em;
    color: #7A776D;
    margin-bottom: 10px;
  }

  .header-text .description {
    margin: 10px 0 0;
    font-size: 16px;
    color: #7A776D;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 1px solid #E4E1D8;
    border-radius: 999px;
    padding: 6px;
  }

  .month-nav button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #E4E1D8;
    background: #fff;
    color: #33322F;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .month-nav button:hover {
    background: #F4F2EC;
  }

  .month-label {
    font-size: 18px;
    font-weight: 700;
    min-width: 132px;
    text-align: center;
    font-family: 'Noto Serif TC', serif;
  }

  .today-btn {
    margin-left: 8px;
    border: 1px solid #33322F;
    background: #33322F;
    color: #FAFAF7;
    font-size: 14px;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s;
  }

  .today-btn:hover {
    background: #54524C;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 20px;
    margin-bottom: 32px;
  }

  .summary-card {
    background: #fff;
    border: 1px solid #E4E1D8;
    border-radius: 3px;
    padding: 28px 32px;
  }

  .summary-card-label {
    font-size: 14px;
    color: #7A776D;
    margin-bottom: 12px;
  }

  .summary-card-value {
    font-family: 'Noto Serif TC', serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .summary-card-subtext {
    font-size: 14px;
    color: #7A776D;
    margin-top: 8px;
  }

  .next-payment-card {
    background: #fff;
    border: 1px solid #E4E1D8;
    border-radius: 3px;
    padding: 28px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .next-payment-label {
    font-size: 14px;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .next-payment-name {
    font-size: 21px;
    font-weight: 700;
  }

  .next-payment-detail {
    font-size: 14px;
    color: #7A776D;
    margin-top: 6px;
  }

  .next-payment-amount {
    font-family: 'Noto Serif TC', serif;
    font-size: 26px;
    font-weight: 700;
    white-space: nowrap;
  }

  .calendar-container {
    background: #fff;
    border: 1px solid #E4E1D8;
    border-radius: 3px;
    overflow: hidden;
  }

  .calendar-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid #E4E1D8;
  }

  .calendar-header-day {
    padding: 16px 0;
    text-align: center;
    font-size: 14px;
    color: #7A776D;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .calendar-cell {
    padding: 14px 12px;
    min-height: 116px;
    border-right: 1px solid #EFECE3;
    border-bottom: 1px solid #EFECE3;
    cursor: default;
    background: #FFFFFF;
    position: relative;
    box-sizing: border-box;
    transition: background 0.2s;
  }

  .calendar-cell.clickable {
    cursor: pointer;
  }

  .calendar-cell.other-month {
    background: #FCFBF8;
  }

  .calendar-cell.has-overdue {
    background: #FBF3EF;
  }

  .calendar-cell.today {
    box-shadow: inset 0 0 0 2px #33322F;
  }

  .cell-day-num {
    font-size: 14px;
    color: #9C9C94;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cell-day-num.in-month {
    color: #33322F;
  }

  .cell-day-num.other-month {
    color: #D8D4C7;
  }

  .today-badge {
    font-size: 10px;
    background: #33322F;
    color: #FAFAF7;
    padding: 2px 7px;
    border-radius: 999px;
  }

  .cell-amount {
    margin-top: 10px;
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    font-weight: 700;
  }

  .loan-tag {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 5px;
  }

  .loan-tag-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .loan-tag-name {
    font-size: 12.5px;
    color: #635F54;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 20px;
    font-size: 13.5px;
    color: #7A776D;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(51, 50, 47, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 24px;
  }

  .modal-content {
    background: #FDFCF8;
    border-radius: 2px;
    width: 440px;
    max-width: 100%;
    max-height: 82vh;
    overflow: auto;
    padding: 36px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.2);
    border-top: 3px solid #33322F;
  }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .modal-title {
    font-size: 14px;
    color: #7A776D;
    margin-bottom: 6px;
  }

  .modal-date {
    font-family: 'Noto Serif TC', serif;
    font-size: 24px;
    font-weight: 700;
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid #E4E1D8;
    background: #fff;
    color: #33322F;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .modal-close:hover {
    background: #F4F2EC;
  }

  .loan-card {
    border: 1px solid #E4E1D8;
    border-radius: 2px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .loan-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .loan-card-name {
    font-size: 17px;
    font-weight: 700;
  }

  .loan-status-badge {
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 999px;
    font-weight: 500;
  }

  .loan-card-category {
    font-size: 13.5px;
    color: #7A776D;
    margin-bottom: 16px;
  }

  .loan-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .loan-detail-label {
    font-size: 12.5px;
    color: #7A776D;
    margin-bottom: 4px;
  }

  .loan-detail-value {
    font-family: 'Noto Serif TC', serif;
    font-size: 19px;
    font-weight: 700;
  }

  .loan-detail-text {
    font-size: 15px;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>
<div id="app">
  <div class="background-accent"></div>
  <div class="background-accent-small"></div>

  <div class="header">
    <div class="header-text">
      <div class="subtitle">貸款管理・債務總覽</div>
      <h1>貸款月曆</h1>
      <p class="description">點擊到期日，查看貸款詳情</p>
    </div>

    <div class="month-nav">
      <button id="prevBtn">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextBtn">›</button>
      <button class="today-btn" id="todayBtn">今天</button>
    </div>
  </div>

  <div class="summary-grid">
    <div class="summary-card">
      <div class="summary-card-label">尚欠總額</div>
      <div class="summary-card-value" id="totalDebt">$0</div>
      <div class="summary-card-subtext">共 <span id="loanCount">0</span> 筆帳戶</div>
    </div>
    <div class="next-payment-card" id="nextPaymentCard" style="border-left: 3px solid #7C8B6F;">
      <div>
        <div class="next-payment-label" id="nextPaymentLabel">已全部繳清</div>
        <div class="next-payment-name" id="nextPaymentLoanName">目前無待繳款項</div>
        <div class="next-payment-detail" id="nextPaymentDetail">本月沒有排定的還款</div>
      </div>
      <div class="next-payment-amount" id="nextPaymentAmount">—</div>
    </div>
  </div>

  <div class="calendar-container">
    <div class="calendar-header">
      <div class="calendar-header-day">日</div>
      <div class="calendar-header-day">一</div>
      <div class="calendar-header-day">二</div>
      <div class="calendar-header-day">三</div>
      <div class="calendar-header-day">四</div>
      <div class="calendar-header-day">五</div>
      <div class="calendar-header-day">六</div>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <span class="legend-dot" style="background: #B5573F;"></span>
      <span>逾期</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background: #9C9C94;"></span>
      <span>待繳</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background: #7C8B6F;"></span>
      <span>已繳</span>
    </div>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <div class="modal-title">到期日</div>
        <div class="modal-date" id="modalDate"></div>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div id="modalLoans"></div>
  </div>
</div>

<script type="module">
  const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const WEEKDAYS = ['週日','週一','週二','週三','週四','週五','週六'];

  const INK = '#33322F';
  const MUTED = '#9C9C94';
  const OVERDUE = '#B5573F';
  const OVERDUE_WASH = '#FBF3EF';
  const PAID = '#7C8B6F';

  function fmtMoney(n) {
    return '$' + Math.round(n).toLocaleString('en-US');
  }

  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  class LoanCalendar {
    constructor() {
      this.today = new Date(2026, 6, 8);
      this.baseMonth = new Date(2026, 6, 1);
      this.monthOffset = 0;
      this.selectedDate = null;

      this.loans = [
        { id: 'l1', name: '房屋貸款', lender: '國泰世華銀行', category: '房貸', date: new Date(2026, 6, 1), amount: 1850, balance: 248000, apr: '6.2%', status: 'paid' },
        { id: 'l2', name: '中信信用卡', lender: '中國信託', category: '信用卡', date: new Date(2026, 6, 3), amount: 420, balance: 2180, apr: '24.99%', status: 'paid' },
        { id: 'l3', name: '汽車貸款', lender: '裕融企業', category: '車貸', date: new Date(2026, 6, 6), amount: 410, balance: 9200, apr: '5.4%', status: 'unpaid' },
        { id: 'l4', name: '個人信貸', lender: '王道銀行', category: '個人信貸', date: new Date(2026, 6, 15), amount: 260, balance: 6400, apr: '11.9%', status: 'unpaid' },
        { id: 'l5', name: '台新信用卡', lender: '台新銀行', category: '信用卡', date: new Date(2026, 6, 20), amount: 180, balance: 1050, apr: '22.49%', status: 'unpaid' },
        { id: 'l6', name: '學生貸款', lender: '教育部就學貸款', category: '學生貸款', date: new Date(2026, 6, 28), amount: 310, balance: 18300, apr: '4.5%', status: 'unpaid' }
      ];

      this.setupEventListeners();
      this.render();
    }

    setupEventListeners() {
      document.getElementById('prevBtn').addEventListener('click', () => this.prevMonth());
      document.getElementById('nextBtn').addEventListener('click', () => this.nextMonth());
      document.getElementById('todayBtn').addEventListener('click', () => this.goToday());
      document.getElementById('modalClose').addEventListener('click', () => this.closeModal());
      document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === document.getElementById('modalOverlay')) {
          this.closeModal();
        }
      });
    }

    prevMonth() {
      this.monthOffset--;
      this.render();
    }

    nextMonth() {
      this.monthOffset++;
      this.render();
    }

    goToday() {
      this.monthOffset = 0;
      this.selectedDate = null;
      this.closeModal();
      this.render();
    }

    closeModal() {
      this.selectedDate = null;
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    loanStatusInfo(loan) {
      if (loan.status === 'paid') return { label: '已繳', dot: PAID, textColor: PAID };
      if (loan.date < this.today) return { label: '逾期', dot: OVERDUE, textColor: OVERDUE };
      return { label: '待繳', dot: MUTED, textColor: INK };
    }

    render() {
      const viewDate = new Date(this.baseMonth.getFullYear(), this.baseMonth.getMonth() + this.monthOffset, 1);
      const viewYear = viewDate.getFullYear();
      const viewMonth = viewDate.getMonth();

      const gridStart = new Date(viewYear, viewMonth, 1 - new Date(viewYear, viewMonth, 1).getDay());

      // Update month label
      document.getElementById('monthLabel').textContent = viewYear + '年' + MONTHS[viewMonth];

      // Calculate cells
      const calendarGrid = document.getElementById('calendarGrid');
      calendarGrid.innerHTML = '';

      for (let i = 0; i < 42; i++) {
        const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
        const inMonth = d.getMonth() === viewMonth;
        const isToday = sameDay(d, this.today);
        const dayLoans = this.loans.filter(l => sameDay(l.date, d));
        const hasLoans = dayLoans.length > 0;
        const hasOverdue = dayLoans.some(l => l.status !== 'paid' && l.date < this.today);
        const totalDue = dayLoans.reduce((sum, l) => sum + l.amount, 0);
        const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();

        const cell = document.createElement('div');
        cell.className = 'calendar-cell';
        if (!inMonth) cell.classList.add('other-month');
        if (hasOverdue) cell.classList.add('has-overdue');
        if (isToday) cell.classList.add('today');
        if (hasLoans) cell.classList.add('clickable');

        let cellHTML = `<div class="cell-day-num ${inMonth ? 'in-month' : 'other-month'}">`;
        cellHTML += `<span>${d.getDate()}</span>`;
        if (isToday) cellHTML += `<span class="today-badge">今天</span>`;
        cellHTML += `</div>`;

        if (hasLoans) {
          const amountColor = hasOverdue ? OVERDUE : INK;
          cellHTML += `<div class="cell-amount" style="color: ${amountColor};">${fmtMoney(totalDue)}</div>`;
          dayLoans.forEach(l => {
            const status = this.loanStatusInfo(l);
            cellHTML += `<div class="loan-tag">
              <span class="loan-tag-dot" style="background: ${status.dot};"></span>
              <span class="loan-tag-name">${l.name}</span>
            </div>`;
          });
        }

        cell.innerHTML = cellHTML;

        if (hasLoans) {
          const dateStr = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
          cell.addEventListener('click', () => this.openModal(dateStr));
        }

        calendarGrid.appendChild(cell);
      }

      this.updateSummary();
    }

    updateSummary() {
      const totalDebt = this.loans.reduce((sum, l) => sum + l.balance, 0);
      document.getElementById('totalDebt').textContent = fmtMoney(totalDebt);
      document.getElementById('loanCount').textContent = this.loans.length;

      const unpaid = this.loans.filter(l => l.status !== 'paid');
      const overdueLoans = unpaid.filter(l => l.date < this.today).sort((a, b) => a.date - b.date);
      const upcomingLoans = unpaid.filter(l => l.date >= this.today).sort((a, b) => a.date - b.date);

      let featured = null, label = '已全部繳清', accent = PAID;
      if (overdueLoans.length) {
        featured = overdueLoans[0];
        label = '逾期未繳';
        accent = OVERDUE;
      } else if (upcomingLoans.length) {
        featured = upcomingLoans[0];
        label = '下次還款';
        accent = INK;
      }

      document.getElementById('nextPaymentLabel').textContent = label;
      document.getElementById('nextPaymentLabel').style.color = accent;
      document.getElementById('nextPaymentCard').style.borderLeftColor = accent;

      if (featured) {
        document.getElementById('nextPaymentLoanName').textContent = featured.name;
        document.getElementById('nextPaymentDetail').textContent = (featured.date.getMonth() + 1) + '月' + featured.date.getDate() + '日・' + featured.lender;
        document.getElementById('nextPaymentAmount').textContent = fmtMoney(featured.amount);
        document.getElementById('nextPaymentAmount').style.color = accent;
      } else {
        document.getElementById('nextPaymentLoanName').textContent = '目前無待繳款項';
        document.getElementById('nextPaymentDetail').textContent = '本月沒有排定的還款';
        document.getElementById('nextPaymentAmount').textContent = '—';
        document.getElementById('nextPaymentAmount').style.color = PAID;
      }
    }

    openModal(dateStr) {
      const [y, m, dd] = dateStr.split('-').map(Number);
      const sd = new Date(y, m, dd);
      document.getElementById('modalDate').textContent = (m + 1) + '月' + dd + '日・' + WEEKDAYS[sd.getDay()];

      const loansForDate = this.loans.filter(l => sameDay(l.date, sd));
      const modalLoans = document.getElementById('modalLoans');
      modalLoans.innerHTML = '';

      loansForDate.forEach(l => {
        const s = this.loanStatusInfo(l);
        const card = document.createElement('div');
        card.className = 'loan-card';

        let statusBg = '#EEF1EA';
        if (l.status !== 'paid') {
          statusBg = l.date < this.today ? '#F7E8E3' : '#F1F0EB';
        }

        card.innerHTML = `
          <div class="loan-card-header">
            <div class="loan-card-name">${l.name}</div>
            <div class="loan-status-badge" style="background: ${statusBg}; color: ${s.textColor};">${s.label}</div>
          </div>
          <div class="loan-card-category">${l.category}</div>
          <div class="loan-details">
            <div>
              <div class="loan-detail-label">應繳金額</div>
              <div class="loan-detail-value">${fmtMoney(l.amount)}</div>
            </div>
            <div>
              <div class="loan-detail-label">尚欠餘額</div>
              <div class="loan-detail-value">${fmtMoney(l.balance)}</div>
            </div>
            <div>
              <div class="loan-detail-label">利率</div>
              <div class="loan-detail-text">${l.apr}</div>
            </div>
            <div>
              <div class="loan-detail-label">貸款機構</div>
              <div class="loan-detail-text">${l.lender}</div>
            </div>
          </div>
        `;
        modalLoans.appendChild(card);
      });

      this.selectedDate = dateStr;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }
  }

  new LoanCalendar();
</script>
</body>
</html>
